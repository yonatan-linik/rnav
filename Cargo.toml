[package]
name = "rnav"
version = "0.1.0"
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/yonatan-linik/rnav"
keywords = ["log", "tui", "viewer", "navigator"]
categories = ["command-line-utilities", "filesystem", "text-processing"]

[lib]
name = "rnav"
test = true
doctest = true

[dependencies]
chrono = "0.4.39"
clap = { version = "4.5.26", features = ["derive"] }
color-eyre = "0.6.3"
crossterm = "0.28.1"
itertools = "0.14.0"
num-format = "0.4.4"
rand = "0.8.5"
ratatui = "0.29.0"
regex = "1.11.1"
strum = { version = "0.26.3", features = ["strum_macros"] }
thiserror = "2.0.11"
memmap2 = "0.9"
